<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petra Ride - بترا رايد</title>

    <!-- Smart App Banner — iOS shows native "OPEN" bar -->
    <meta name="apple-itunes-app" content="app-id=1463809354">

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1978946559142167');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1978946559142167&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0E37A6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 360px; width: 100%; }
        .logo-text { font-size: 26px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
        .tagline { font-size: 14px; opacity: 0.85; margin-bottom: 24px; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 14px; opacity: 0.9; }
        .store-btn {
            display: block;
            padding: 16px 24px;
            margin: 20px auto 0;
            max-width: 300px;
            border-radius: 14px;
            background: #fff;
            color: #0E37A6;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .store-btn:active { opacity: 0.85; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">PETRA RIDE</div>
        <div class="tagline">منكم وفيكم</div>

        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">عم نوجهك للمتجر...</div>

        <!-- Fallback button — only shown if auto-redirect doesn't fire (e.g. blocked by in-app browser) -->
        <a class="store-btn hidden" id="fallback-link" href="#">
            اضغط هون للمتابعة
        </a>
    </div>

    <script>
    (function() {
        try {
            var params = new URLSearchParams(window.location.search);
            var campaign = params.get('c') || 'general';
            var ce = encodeURIComponent(campaign);

            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua);
            var isAndroid = /android/i.test(ua);
            var isInApp = /FBAN|FBAV|Instagram|Messenger|Line|Snapchat/i.test(ua);

            var iosHTTPS = 'https://apps.apple.com/app/id1463809354?ct=' + ce;
            var androidHTTPS = 'https://play.google.com/store/apps/details?id=com.PetraRide_User'
                + '&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D' + ce;
            var androidIntent = 'intent://details?id=com.PetraRide_User&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D' + ce
                + '#Intent;scheme=market;package=com.android.vending;end';

            // Fire pixel
            if (typeof fbq === 'function') {
                fbq('track', 'Lead', { content_name: 'store_redirect', campaign: campaign });
            }

            var fallback = document.getElementById('fallback-link');
            var status = document.getElementById('status');
            var spinner = document.getElementById('spinner');

            function showFallback(url) {
                fallback.href = url;
                fallback.classList.remove('hidden');
                spinner.classList.add('hidden');
                status.textContent = 'مش عم يفتح المتجر أوتوماتيك؟';
            }

            if (isIOS) {
                fallback.href = iosHTTPS;
                if (isInApp) {
                    window.location.replace(iosHTTPS);
                } else {
                    window.location.href = 'itms-apps://apps.apple.com/app/id1463809354?ct=' + ce;
                    setTimeout(function() { window.location.href = iosHTTPS; }, 800);
                }
                setTimeout(function() { showFallback(iosHTTPS); }, 2000);

            } else if (isAndroid) {
                fallback.href = androidHTTPS;
                if (isInApp) {
                    window.location.replace(androidIntent);
                } else {
                    window.location.href = 'market://details?id=com.PetraRide_User&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D' + ce;
                    setTimeout(function() { window.location.href = androidHTTPS; }, 800);
                }
                setTimeout(function() { showFallback(androidHTTPS); }, 2000);

            } else {
                spinner.classList.add('hidden');
                status.textContent = 'افتح هاد الرابط من موبايلك';
            }
        } catch(e) {
            document.getElementById('status').textContent = 'صار خطأ، جرب مرة ثانية';
        }
    })();
    </script>
</body>
</html>
