<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petra Ride - بترا رايد</title>

    <!-- Smart App Banner — iOS shows native "OPEN" bar -->
    <meta name="apple-itunes-app" content="app-id=1463809354">

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1978946559142167');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1978946559142167&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0E37A6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 360px; width: 100%; }
        .logo-text { font-size: 28px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
        .tagline { font-size: 16px; opacity: 0.85; margin-bottom: 40px; }
        .subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 20px; }
        .store-btn {
            display: block;
            padding: 18px 24px;
            margin: 14px auto;
            max-width: 300px;
            border-radius: 14px;
            background: #fff;
            color: #0E37A6;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            -webkit-tap-highlight-color: transparent;
        }
        .store-btn:active { opacity: 0.85; }
        .help-text {
            margin-top: 30px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.8;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">PETRA RIDE</div>
        <div class="tagline">منكم وفيكم</div>
        <div class="subtitle">حمّل التطبيق</div>

        <a class="store-btn" id="ios-link"
           href="https://apps.apple.com/app/id1463809354">
            App Store حمّل من
        </a>

        <a class="store-btn" id="android-link"
           href="https://play.google.com/store/apps/details?id=com.PetraRide_User">
            Google Play حمّل من
        </a>

        <div id="help" class="help-text hidden">
            مش عم يفتح المتجر؟<br>
            اضغط على ⋯ فوق يمين الشاشة<br>
            ثم اختر "فتح في Safari"
        </div>
    </div>

    <script>
    (function() {
        try {
            var params = new URLSearchParams(window.location.search);
            var campaign = params.get('c') || 'general';
            var ce = encodeURIComponent(campaign);

            var iosHTTPS = 'https://apps.apple.com/app/id1463809354?ct=' + ce;
            var androidHTTPS = 'https://play.google.com/store/apps/details?id=com.PetraRide_User'
                + '&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D' + ce;

            var iosEl = document.getElementById('ios-link');
            var androidEl = document.getElementById('android-link');

            iosEl.href = iosHTTPS;
            androidEl.href = androidHTTPS;

            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua);
            var isAndroid = /android/i.test(ua);
            var isInApp = /FBAN|FBAV|Instagram|Messenger|Line|Snapchat/i.test(ua);

            if (isInApp) {
                // In-app browser: use location.replace on click
                // This works better than href navigation in WebViews
                if (isIOS) {
                    iosEl.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.replace(iosHTTPS);
                    });
                }
                if (isAndroid) {
                    androidEl.addEventListener('click', function(e) {
                        e.preventDefault();
                        // Android intent:// forces system browser to handle it
                        var intentURL = 'intent://details?id=com.PetraRide_User&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D' + ce
                            + '#Intent;scheme=market;package=com.android.vending;end';
                        window.location.replace(intentURL);
                    });
                }
                document.getElementById('help').classList.remove('hidden');
            } else {
                // Regular browser: use native schemes
                if (isIOS) {
                    iosEl.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.href = 'itms-apps://apps.apple.com/app/id1463809354?ct=' + ce;
                        setTimeout(function() { window.location.href = iosHTTPS; }, 1000);
                    });
                }
                if (isAndroid) {
                    androidEl.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.href = 'market://details?id=com.PetraRide_User&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D' + ce;
                        setTimeout(function() { window.location.href = androidHTTPS; }, 1000);
                    });
                }
            }

            // Fire pixel
            if (typeof fbq === 'function') {
                fbq('track', 'Lead', { content_name: 'store_redirect', campaign: campaign });
            }
        } catch(e) {}
    })();
    </script>
</body>
</html>
