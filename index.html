<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petra Ride - بترا رايد</title>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1978946559142167');

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1978946559142167&ev=PageView&noscript=1"
    /></noscript>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0E37A6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 360px; width: 100%; }
        .logo-text { font-size: 28px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
        .tagline { font-size: 16px; opacity: 0.85; margin-bottom: 40px; }
        .subtitle { font-size: 15px; opacity: 0.9; margin-bottom: 20px; }
        .store-btn {
            display: block;
            padding: 18px 24px;
            margin: 14px auto;
            max-width: 300px;
            border-radius: 14px;
            background: #fff;
            color: #0E37A6;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            -webkit-tap-highlight-color: transparent;
        }
        .store-btn:active { opacity: 0.85; }
        .help-text {
            margin-top: 30px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.6;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">PETRA RIDE</div>
        <div class="tagline">منكم وفيكم</div>
        <div class="subtitle">حمّل التطبيق</div>

        <a id="ios-link" class="store-btn" href="itms-apps://apps.apple.com/app/id1463809354">
            App Store حمّل من
        </a>

        <a id="android-link" class="store-btn" href="market://details?id=com.PetraRide_User">
            Google Play حمّل من
        </a>

        <div id="help" class="help-text">
            مش عم يفتح؟ اضغط على ⋯ فوق يمين ثم "افتح في المتصفح"
        </div>
    </div>

    <script>
    (function() {
        try {
            var params = new URLSearchParams(window.location.search);
            var campaign = params.get('c') || 'general';

            // Update iOS link with campaign param
            document.getElementById('ios-link').href =
                'itms-apps://apps.apple.com/app/id1463809354?ct=' + encodeURIComponent(campaign);

            // Update Android link with campaign param
            document.getElementById('android-link').href =
                'market://details?id=com.PetraRide_User&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D'
                + encodeURIComponent(campaign);

            // Fire lead event
            if (typeof fbq === 'function') {
                fbq('track', 'Lead', { content_name: 'store_redirect', campaign: campaign });
            }

            // Show help text if in-app browser detected
            var ua = navigator.userAgent || '';
            if (/FBAN|FBAV|Instagram|Messenger/i.test(ua)) {
                document.getElementById('help').style.display = 'block';
            }
        } catch(e) {}
    })();
    </script>
</body>
</html>
