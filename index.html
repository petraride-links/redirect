<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petra Ride - بترا رايد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0E37A6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 360px;
        }
        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 32px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            font-size: 14px;
            opacity: 0.75;
            margin-bottom: 32px;
        }
        .fallback {
            display: none;
            margin-top: 16px;
        }
        .fallback a {
            display: block;
            padding: 14px 24px;
            margin: 10px 0;
            border-radius: 12px;
            background: #fff;
            color: #0E37A6;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        .fallback a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">PETRA RIDE</div>
        <div class="tagline">منكم وفيكم</div>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">جاري التحويل...</div>
        <div class="fallback" id="fallback">
            <p style="margin-bottom: 12px; font-size: 14px;">اختر متجرك</p>
            <a id="android-link" href="#">Google Play</a>
            <a id="ios-link" href="#">App Store</a>
        </div>
    </div>

    <script>
        (function() {
            // Read campaign tag from URL: ?c=JO26
            var params = new URLSearchParams(window.location.search);
            var campaign = params.get('c') || 'general';

            // Build store URLs with tracking
            var androidURL = 'https://play.google.com/store/apps/details?id=com.PetraRide_User'
                + '&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D'
                + encodeURIComponent(campaign);

            var iosURL = 'https://apps.apple.com/app/id1463809354?ct='
                + encodeURIComponent(campaign);

            // Set fallback links
            document.getElementById('android-link').href = androidURL;
            document.getElementById('ios-link').href = iosURL;

            // Detect OS
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(ua);

            // Redirect
            if (isAndroid) {
                window.location.replace(androidURL);
            } else if (isIOS) {
                window.location.replace(iosURL);
            } else {
                // Desktop or unknown — show both buttons
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status').textContent = 'حمّل التطبيق';
                document.getElementById('fallback').style.display = 'block';
            }

            // If redirect didn't fire in 3 seconds, show fallback buttons
            setTimeout(function() {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status').textContent = 'حمّل التطبيق';
                document.getElementById('fallback').style.display = 'block';
            }, 3000);
        })();
    </script>
</body>
</html>
