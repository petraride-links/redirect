<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petra Ride - بترا رايد</title>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1978946559142167');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1978946559142167&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0E37A6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 360px;
        }
        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 32px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            font-size: 14px;
            opacity: 0.75;
            margin-bottom: 32px;
        }
        .fallback {
            display: none;
            margin-top: 16px;
        }
        .fallback a {
            display: block;
            padding: 14px 24px;
            margin: 10px 0;
            border-radius: 12px;
            background: #fff;
            color: #0E37A6;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        .fallback a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">PETRA RIDE</div>
        <div class="tagline">منكم وفيكم</div>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">جاري التحويل...</div>
        <div class="fallback" id="fallback">
            <p style="margin-bottom: 12px; font-size: 14px;">اختر متجرك</p>
            <a id="android-link" href="#">Google Play</a>
            <a id="ios-link" href="#">App Store</a>
        </div>
    </div>

    <script>
        (function() {
            // Read campaign tag from URL: ?c=JO26
            var params = new URLSearchParams(window.location.search);
            var campaign = params.get('c') || 'general';

            // Build store URLs with tracking
            var androidURL = 'https://play.google.com/store/apps/details?id=com.PetraRide_User'
                + '&referrer=utm_source%3Dfacebook%26utm_medium%3Dpaid%26utm_campaign%3D'
                + encodeURIComponent(campaign);

            var iosURL = 'https://apps.apple.com/app/id1463809354?ct='
                + encodeURIComponent(campaign);

            // Set fallback links
            document.getElementById('android-link').href = androidURL;
            document.getElementById('ios-link').href = iosURL;

            // Detect OS
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(ua);

            // Redirect — delayed slightly (500ms) so the Meta Pixel PageView
            // event has time to fire before the browser navigates away.
            var REDIRECT_DELAY_MS = 500;

            if (isAndroid) {
                setTimeout(function () {
                    window.location.replace(androidURL);
                }, REDIRECT_DELAY_MS);
            } else if (isIOS) {
                setTimeout(function () {
                    window.location.replace(iosURL);
                }, REDIRECT_DELAY_MS);
            } else {
                // Desktop or unknown — show both buttons
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status').textContent = 'حمّل التطبيق';
                document.getElementById('fallback').style.display = 'block';
            }

            // If redirect didn't fire in 3 seconds, show fallback buttons
            setTimeout(function() {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status').textContent = 'حمّل التطبيق';
                document.getElementById('fallback').style.display = 'block';
            }, 3000);
        })();
    </script>
</body>
</html>
